<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <rect width="900" height="200" fill="white"/>
  <text x="450" y="25" text-anchor="middle" font-weight="bold">Figure 5.1: Patient books appointment</text>
  <rect x="20" y="60" width="90" height="40" fill="#e3f2fd" stroke="#333"/><text x="65" y="85" text-anchor="middle" font-size="11">Patient</text>
  <rect x="160" y="60" width="100" height="40" fill="#fff" stroke="#333"/><text x="210" y="85" text-anchor="middle" font-size="11">Frontend</text>
  <rect x="310" y="60" width="100" height="40" fill="#fff" stroke="#333"/><text x="360" y="85" text-anchor="middle" font-size="11">Backend</text>
  <rect x="460" y="60" width="100" height="40" fill="#e8f5e9" stroke="#333"/><text x="510" y="85" text-anchor="middle" font-size="11">MongoDB</text>
  <text x="120" y="130" font-size="10">1: search doctors</text>
  <text x="270" y="130" font-size="10">2: GET /api/doctor/list</text>
  <text x="420" y="130" font-size="10">3-4: query &amp; return</text>
  <text x="120" y="155" font-size="10">5-6: select slot &amp; pay</text>
  <text x="270" y="155" font-size="10">7: POST book-appointment</text>
  <text x="420" y="155" font-size="10">8-9: save &amp; confirm</text>
  <line x1="110" y1="80" x2="160" y2="80" stroke="#333" marker-end="url(#a)"/>
  <line x1="260" y1="80" x2="310" y2="80" stroke="#333" marker-end="url(#a)"/>
  <line x1="410" y1="80" x2="460" y2="80" stroke="#333" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#333"/></marker></defs>
</svg>
