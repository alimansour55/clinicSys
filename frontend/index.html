<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&family=Noto+Naskh+Arabic:wght@400..700&display=swap" />
    <script>
      /* Before first paint, so a dark-theme visit never flashes light. Mirrors utils/theme.js. */
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('clinivoTheme')
          if (stored === 'dark') theme = 'dark'
          if (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        try {
          if (localStorage.getItem('clinicSysLanguage') === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
    <title>Clinivo</title>
    <!--
      Static share defaults. Link previews in chat apps do not run JavaScript, so they read these;
      usePageMeta replaces them per page for crawlers that do. Absolute URLs, as share cards require.
    -->
    <meta name="description" content="Find the right doctor and book a real open time: at the clinic, by phone, by video or at home. In English and Arabic." />
    <link rel="canonical" href="https://www.clinivo.shop/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clinivo" />
    <meta property="og:url" content="https://www.clinivo.shop/" />
    <meta property="og:title" content="Clinivo" />
    <meta property="og:description" content="Find the right doctor and book a real open time: at the clinic, by phone, by video or at home. In English and Arabic." />
    <meta property="og:image" content="https://www.clinivo.shop/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clinivo: book a doctor in English or Arabic" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="ar_EG" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clinivo" />
    <meta name="twitter:description" content="Find the right doctor and book a real open time: at the clinic, by phone, by video or at home. In English and Arabic." />
    <meta name="twitter:image" content="https://www.clinivo.shop/og-image.png" />
    <meta name="twitter:image:alt" content="Clinivo: book a doctor in English or Arabic" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
