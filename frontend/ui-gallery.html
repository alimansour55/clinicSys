<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f5" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Instrument+Sans:wght@400..700&family=Newsreader:opsz,wght@6..72,400..600&family=Noto+Naskh+Arabic:wght@400..700&display=swap" />
    <script>
      /* Before first paint, so a dark-theme visit never flashes light. Mirrors utils/theme.js. */
      (function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('clinivoTheme')
          if (stored === 'dark') theme = 'dark'
          if (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        try {
          if (localStorage.getItem('clinicSysLanguage') === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) {}
      })()
    </script>
    <title>Clinivo UI gallery</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui-gallery/main.jsx"></script>
  </body>
</html>
